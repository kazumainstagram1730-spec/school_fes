```html
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 SLOT GAME</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">
        <h1>🎰 SLOT GAME</h1>

        <div class="coins">
            COINS: <span id="coins">100</span>
        </div>

        <div class="slot-machine">

            <div class="reel" id="reel1">🍒</div>
            <div class="reel" id="reel2">🍋</div>
            <div class="reel" id="reel3">🔔</div>

        </div>

        <div class="result" id="result">
            BETしてSPIN！
        </div>

        <div class="bet-area">
            <button id="betMinus">−</button>
            <span>BET: <span id="bet">10</span></span>
            <button id="betPlus">＋</button>
        </div>

        <button class="spin-button" id="spinButton">
            SPIN
        </button>

        <div class="paytable">
            <h2>配当表</h2>

            <p>🍒 🍒 🍒 → ×5</p>
            <p>🍋 🍋 🍋 → ×8</p>
            <p>🔔 🔔 🔔 → ×10</p>
            <p>⭐ ⭐ ⭐ → ×20</p>
            <p>7️⃣ 7️⃣ 7️⃣ → ×50</p>
            <p>その他 → ×0</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
```
